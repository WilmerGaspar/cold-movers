name: branch checks (no commits)

# Runs only on the global-scientific-upgrade branch. Read-only: it never commits or pushes, so main is
# never touched. Everything it produces is kept as a downloadable artifact of the run.
on:
  workflow_dispatch:
  push:
    branches: [global-scientific-upgrade]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail: a failing step stays failed even when piped into tee

jobs:
  from-scratch:
    # A fresh machine, no cache: install exactly as the README says, then run everything.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install as in the README
        run: pip install -r requirements.txt pytest
      - name: Dependency consistency
        run: pip check
      - name: Unit tests
        run: python -m pytest -q tests 2>&1 | tee tests.txt
      - name: Frozen results open
        if: always()
        run: python scripts/check_results.py
      - name: README numbers match the generated results
        if: always()
        run: python scripts/check_readme_numbers.py | tee readme_numbers.md
      - name: README, app and report use the same evidence ledger
        if: always()
        run: python scripts/evidence_report.py --check
      - name: The whole app, headless, for every example
        if: always()
        run: python -u scripts/smoke_app.py 2>&1 | tee smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: from-scratch
          path: |
            tests.txt
            readme_numbers.md
            smoke.txt

  reproduce:
    # Regenerate every published result with the code and compare with the committed files.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Keep the committed results
        run: mkdir committed && cp data/scoreboard.json docs/scoreboard.md docs/validation.md docs/validation_records.md docs/validation_records.csv docs/benchmark_injection.json committed/ && (cp docs/benchmark_holdout_A.json committed/ || true)
      - name: Scoreboard
        run: python -u scripts/scoreboard.py > scoreboard_log.txt
      - name: Validation table and evidence records
        run: python -u scripts/validation_report.py > validation_log.txt
      - name: Development benchmark (3,300 trials, seed 2026)
        run: python -u scripts/benchmark_injection.py | tee benchmark_log.txt
      - name: Held-out set A (pre-registered, seed 20261115)
        run: python -u scripts/benchmark_holdout.py --label A | tee holdout_A_log.txt
      - name: Compare regenerated with committed
        run: |
          python - <<'EOF' | tee reproduce.md
          import json, os
          VOLATILE = {"generated_utc", "seconds", "app_version"}
          def clean(x):
              if isinstance(x, dict):
                  return {k: clean(v) for k, v in x.items() if k not in VOLATILE}
              if isinstance(x, list):
                  return [clean(v) for v in x]
              if isinstance(x, float) and x != x:
                  return "NaN"  # NaN never equals NaN; compare it as a label
              return x
          def close(a, b):
              if isinstance(a, float) and isinstance(b, float):
                  return abs(a - b) <= 1e-9 * max(1.0, abs(a), abs(b))
              return a == b
          def diffs(a, b, path="", tol=True):
              if isinstance(a, dict) and isinstance(b, dict):
                  for k in sorted(set(a) | set(b)):
                      yield from diffs(a.get(k), b.get(k), f"{path}/{k}", tol)
              elif isinstance(a, list) and isinstance(b, list) and len(a) == len(b):
                  for i, (x, y) in enumerate(zip(a, b)):
                      yield from diffs(x, y, f"{path}[{i}]", tol)
              elif not (close(a, b) if tol else a == b):
                  yield f"{path}: regenerated {a!r}, committed {b!r}"
          pairs = [("data/scoreboard.json", "committed/scoreboard.json"), ("docs/scoreboard.md", "committed/scoreboard.md"),
                   ("docs/validation.md", "committed/validation.md"), ("docs/validation_records.md", "committed/validation_records.md"),
                   ("docs/validation_records.csv", "committed/validation_records.csv"),
                   ("docs/benchmark_injection.json", "committed/benchmark_injection.json"),
                   ("docs/benchmark_holdout_A.json", "committed/benchmark_holdout_A.json")]
          print("| File | Regenerated equals committed? |\n|---|---|")
          for new, old in pairs:
              if not os.path.exists(old):
                  print(f"| {new} | no committed copy to compare |"); continue
              if new.endswith(".json"):
                  ca, cb = clean(json.load(open(new))), clean(json.load(open(old)))
                  real = list(diffs(ca, cb))
                  rounding = len(list(diffs(ca, cb, tol=False))) - len(real)
                  same = not real
                  if same and rounding:
                      print(f"| {new} | yes: every count identical; {rounding} floating-point values differ only "
                            "beyond the 9th significant digit (NumPy build) |"); continue
                  for line in real[:15]:
                      print(f"|  ↳ {line} | |")
              else:
                  strip = lambda s: [l for l in s.splitlines() if "version 0." not in l and "Code version" not in l and "code_version" not in l]
                  a, b = open(new).read(), open(old).read()
                  same = a == b or (new.endswith(".md") and strip(a) == strip(b))
                  if new.endswith(".csv") and not same:
                      import csv
                      ra = [{k: v for k, v in r.items() if k != "code_version"} for r in csv.DictReader(open(new))]
                      rb = [{k: v for k, v in r.items() if k != "code_version"} for r in csv.DictReader(open(old))]
                      same = ra == rb
              print(f"| {new} | {'yes' if same else 'NO: differs'} |")
          EOF
      - name: Print the regenerated evidence records (so they can be read from the log)
        run: cat docs/validation_records.md docs/validation_records.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce
          path: |
            reproduce.md
            data/scoreboard.json
            docs/scoreboard.md
            docs/validation.md
            docs/validation_records.md
            docs/validation_records.csv
            docs/benchmark_injection.json
            docs/benchmark_holdout_A.json
            scoreboard_log.txt
            validation_log.txt
            benchmark_log.txt
            holdout_A_log.txt

  calibration:
    # Re-run the pre-registered calibration from the committed per-trial files and compare.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Calibration tests (about 12 minutes)
        run: |
          cp docs/calibration.json committed_calibration.json
          python -u scripts/calibration.py --dev-trials docs/calibration_inputs/development_trials.jsonl --holdout-trials docs/calibration_inputs/holdout_A_trials.jsonl --out regenerated_calibration.json > /dev/null
          python - <<'PY'
          import json
          def walk(a, b, p=""):
              if isinstance(a, dict):
                  for k in sorted(set(a) | set(b)):
                      if k != "code_version":
                          yield from walk(a.get(k), b.get(k), f"{p}/{k}")
              elif isinstance(a, float) and isinstance(b, float):
                  if abs(a - b) > 1e-6 * max(1.0, abs(a)):
                      yield f"{p}: {a} vs {b}"
              elif a != b:
                  yield f"{p}: {a} vs {b}"
          d = list(walk(json.load(open("regenerated_calibration.json")), json.load(open("committed_calibration.json"))))
          print("calibration regenerated equals committed:", "yes" if not d else "NO")
          for x in d[:20]:
              print("  ", x)
          PY

  irsa-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python -u scripts/check_irsa_links.py | tee irsa_links.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irsa-links
          path: irsa_links.md
