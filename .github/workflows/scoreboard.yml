name: validation scoreboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scoreboard.py"
      - "coldmovers/scoreboard.py"

permissions:
  contents: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned app requirements
        run: pip install -r requirements.txt
      - name: Build the scoreboard with the app's own code
        run: python -u scripts/scoreboard.py
      - name: Commit the scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoreboard.json docs/scoreboard.md
          git commit -m "Update the validation scoreboard" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
