name: app screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "scripts/screenshots.py"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check the services the sky atlas needs
        continue-on-error: true
        run: |
          pip install requests astroquery
          python scripts/diag_services.py 2>&1 | tee docs_services_log.txt
      - name: Wait for Streamlit Cloud to redeploy
        run: sleep 240
      - name: Screenshots of the public app
        continue-on-error: true
        run: python -u scripts/screenshots.py 2>&1 | tee docs_screens_log.txt
      - name: Commit screenshots
        if: always()
        run: |
          mkdir -p docs/screens && mv docs_screens_log.txt docs/screens/_log.txt || true
          mv docs_services_log.txt docs/screens/_services.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screens
          git commit -m "Update app screenshots" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
