name: IRSA SPHEREx collections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/irsa_collections.py"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u scripts/irsa_collections.py 2>&1 | tee docs/irsa_collections.txt
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/irsa_collections.txt
          git commit -m "IRSA SPHEREx collections check" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
