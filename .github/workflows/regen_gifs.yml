name: re-render movie GIFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/regen_gifs.py"

permissions:
  contents: write

concurrency:
  group: regen-gifs
  cancel-in-progress: false

jobs:
  gifs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned app requirements
        run: pip install -r requirements.txt
      - name: Re-render the GIFs from the frozen stacks
        run: python -u scripts/regen_gifs.py
      - name: Commit the GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precomputed/*/movie_d*.gif
          git commit -m "Re-render movie GIFs from the frozen stacks" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
