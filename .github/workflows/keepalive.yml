name: keep app awake

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the app
        env:
          APP_URL: https://cold-movers.streamlit.app/
        run: python scripts/keepalive.py
