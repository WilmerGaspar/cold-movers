name: keep app awake

on:
  schedule:
    - cron: "37 * * * *"  # every hour (GitHub may delay scheduled runs; hourly keeps a wide margin)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keepalive.yml"
      - "scripts/keepalive.py"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the app
        env:
          APP_URL: https://cold-movers.streamlit.app/
        run: python -u scripts/keepalive.py
