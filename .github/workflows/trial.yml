name: trial object (not published)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trial.yml"

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Compute TRAPPIST-1 into a trial folder the app does not read
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data/trial
          python scripts/precompute.py --objects trappist1 --max-frames 300 --out data/trial 2>&1 | tee data/trial/_log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trial
          git commit -m "Trial results (not published)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
